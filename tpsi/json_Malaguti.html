<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Malaguti Verifica JSON</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    </head>
    <body>
        <div class="container-fluid text-center">
            <h1>GESTIONE LIBRI</h1>
            <br />
            <div class="container text-center">
                <div class="row">
                    <div class="col-3">
                        <div class="alert theme-success text-center">
                            <h3>Visualizza tutti i Libri</h3>
                        </div>
                        <br />
                        <button type="button" class="btn-subtle theme-success" id="btnCaricaLibri" name="btnCaricaLibri">Carica l'elenco di tutti i libri</button>
                    </div>
                    <div class="col-3">
                        <div class="alert theme-primary" role="alert">
                            <h3>Ricerca Libro per Autore</h3>
                        </div><br />
                        <div class="form-group mb3">
                            <label for="sizesInputDefault" class="form-label">Inserisci Autore (Nome-Cognome)</label>
                            <input class="form-control" id="inputAutore" name="inputAutore" type="text" placeholder="es. Dan Brown">
                            <button type="button" class="btn-subtle theme-primary" id="btnCercaLibriAutore" name="btnCercaLibriAutore">Cerca</button>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="alert theme-warning" role="alert">
                            <h3>Ricerca Libri per anno di pubblicazione</h3>
                        </div><br />
                        <div class="form-group mb3">
                            <label for="sizesInputDefault" class="form-label">Inserisci Anno</label>
                            <input class="form-control" id="inputAnno" name="inputAnno" type="text" placeholder="es. 2000">
                            <button type="button" class="btn-subtle theme-warning" id="btnCercaLibriAnno" name="btnCercaLibriAnno">Cerca</button>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="alert theme-accent" role="alert">
                            <h3>Ricerca Libro con più Pagine pubblicato in un determinato Anno</h3>
                        </div><br />
                        <div class="form-group mb3">
                            <label for="sizesInputDefault" class="form-label">Inserisci Anno</label>
                            <input class="form-control" id="inputAnnoPagine" name="inputAnnoPagine" type="text" placeholder="es. 2000">
                            <button type="button" class="btn-subtle theme-accent" id="btnCercaLibriAnnoPagine" name="btnCercaLibriAnnoPagine">Cerca</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container-fluid text-center" id="view-box"></div>
        </div>

        <script>
            async function caricaElencoLibri(){
                const promise = await fetch("libri.json");
                const vettJson = await promise.json();

                let vb = document.querySelector("#view-box");
                vb.innerHTML = "";

                vb.innerHTML += '<h3>Lista Libri</h3>';
                let strtable = '<table class="table table-striped">';
                strtable += '<thead><tr>';
                strtable += '<th scope="col">ID</td>';
                strtable += '<th scope="col">Titolo</td>';
                strtable += '<th scope="col">Autore</td>';
                strtable += '<th scope="col">Prezzo</td>';
                strtable += '<th scope="col">Pagine</td>';
                strtable += '<th scope="col">Anno</td>';
                strtable += '</tr></thead>';

                for(let i=0; i<vettJson.length; i++){
                    strtable += '<tr>';
                    strtable += '<td scope="row">' + vettJson[i].Id + '</td>';
                    strtable += '<td scope="row">' + vettJson[i].Titolo + '</td>';
                    strtable += '<td scope="row">' + vettJson[i].Autore + '</td>';
                    strtable += '<td scope="row">' + vettJson[i].Prezzo + '</td>';
                    strtable += '<td scope="row">' + vettJson[i].Pagine + '</td>';
                    strtable += '<td scope="row">' + vettJson[i].Anno + '</td>';
                    strtable += '</td>';
                }

                strtable += '</tbody></table>';
                vb.innerHTML += strtable;
            }

            async function cercaLibriAutore(){
                const promise = await fetch("libri.json");
                const vettJson = await promise.json();

                let vb = document.querySelector("#view-box");
                vb.innerHTML = "";

                let autore = document.querySelector("#inputAutore").value;
                let falgTrovato = false;

                vb.innerHTML += '<h3>Ricerca Libri Per Autore</h3>';
                let strtable = '<table class="table table-striped">';
                strtable += '<thead><tr>';
                strtable += '<th scope="col">ID</td>';
                strtable += '<th scope="col">Titolo</td>';
                strtable += '<th scope="col">Autore</td>';
                strtable += '<th scope="col">Prezzo</td>';
                strtable += '<th scope="col">Pagine</td>';
                strtable += '<th scope="col">Anno</td>';
                strtable += '</tr></thead>';

                for(let i=0; i<vettJson.length; i++){
                    if(vettJson[i].Autore == autore){
                        falgTrovato = true;
                        strtable += '<tr>';
                        strtable += '<td scope="row">' + vettJson[i].Id + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Titolo + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Autore + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Prezzo + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Pagine + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Anno + '</td>';
                        strtable += '</td>';
                    }
                }
                strtable += '</tbody></table>';

                if(!falgTrovato)
                    vb.innerHTML += '<h4>Non sono stati trovati libri con autore ' + autore + '</h4>';
                else{
                    vb.innerHTML += '<h4>Elenco Libri con Autore ' + autore + '</h4><br />';
                    vb.innerHTML += strtable;
                }
            }

            async function cercaLibriAnno(){
                const promise = await fetch("libri.json");
                const vettJson = await promise.json();

                let vb = document.querySelector("#view-box");
                vb.innerHTML = "";

                let anno = document.querySelector("#inputAnno").value;
                let falgTrovato = false;

                vb.innerHTML += '<h3>Ricerca Libri per Anno Pubblicazione</h3>';
                let strtable = '<table class="table table-striped">';
                strtable += '<thead><tr>';
                strtable += '<th scope="col">ID</td>';
                strtable += '<th scope="col">Titolo</td>';
                strtable += '<th scope="col">Autore</td>';
                strtable += '<th scope="col">Prezzo</td>';
                strtable += '<th scope="col">Pagine</td>';
                strtable += '<th scope="col">Anno</td>';
                strtable += '</tr></thead>';

                for(let i=0; i<vettJson.length; i++){
                    if(vettJson[i].Anno == anno){
                        falgTrovato = true;
                        strtable += '<tr>';
                        strtable += '<td scope="row">' + vettJson[i].Id + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Titolo + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Autore + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Prezzo + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Pagine + '</td>';
                        strtable += '<td scope="row">' + vettJson[i].Anno + '</td>';
                        strtable += '</td>';
                    }
                }
                strtable += '</tbody></table>';

                if(!falgTrovato)
                    vb.innerHTML += '<h4>Non sono stati trovati libri pubblicati dopo il ' + anno + '</h4>';
                else{
                    vb.innerHTML += '<h4>Elenco Libri pubblicati dopo il ' + anno + '</h4><br />';
                    vb.innerHTML += strtable;
                }
            }

            async function cercaLibriAnnoPagine(){
                const promise = await fetch("libri.json");
                const vettJson = await promise.json();

                let vb = document.querySelector("#view-box");
                vb.innerHTML = "";

                let annoPagine = document.querySelector("#inputAnnoPagine").value;
                let libroMaggiore = 0;
                let pagineMaggiore = 0
                let falgTrovato = false;

                vb.innerHTML += '<h3>Ricerca Libri con maggior numero di pagine per Anno di Pubblicazione</h3>';
                let strtable = '<table class="table table-striped">';
                strtable += '<thead><tr>';
                strtable += '<th scope="col">ID</td>';
                strtable += '<th scope="col">Titolo</td>';
                strtable += '<th scope="col">Autore</td>';
                strtable += '<th scope="col">Prezzo</td>';
                strtable += '<th scope="col">Pagine</td>';
                strtable += '<th scope="col">Anno</td>';
                strtable += '</tr></thead>';

                for(let i=0; i<vettJson.length; i++){
                    if(vettJson[i].Anno == annoPagine && vettJson[i].Pagine > pagineMaggiore){
                        falgTrovato = true;
                        libroMaggiore = i;
                        pagineMaggiore = vettJson[i].Pagine;
                    }
                }
                strtable += '<tr>';
                strtable += '<td scope="row">' + vettJson[libroMaggiore].Id + '</td>';
                strtable += '<td scope="row">' + vettJson[libroMaggiore].Titolo + '</td>';
                strtable += '<td scope="row">' + vettJson[libroMaggiore].Autore + '</td>';
                strtable += '<td scope="row">' + vettJson[libroMaggiore].Prezzo + '</td>';
                strtable += '<td scope="row">' + vettJson[libroMaggiore].Pagine + '</td>';
                strtable += '<td scope="row">' + vettJson[libroMaggiore].Anno + '</td>';
                strtable += '</td>';
                strtable += '</tbody></table>';

                if(!falgTrovato)
                    vb.innerHTML += '<h4>Non sono stati trovati libri pubblicati durante il ' + annoPagine + '</h4>';
                else{
                    vb.innerHTML += '<h4>Libro con più Pagine pubblicato durante il ' + annoPagine + '</h4><br />';
                    vb.innerHTML += strtable;
                }
            }
            
            let btnCaricaLibri = document.querySelector("#btnCaricaLibri");
            btnCaricaLibri.addEventListener('click', caricaElencoLibri);

            let btnCercaLibriAutore = document.querySelector("#btnCercaLibriAutore");
            btnCercaLibriAutore.addEventListener('click', cercaLibriAutore);

            let btnCercaLibriAnno = document.querySelector("#btnCercaLibriAnno");
            btnCercaLibriAnno.addEventListener('click', cercaLibriAnno);

            let btnCercaLibriAnnoPagine = document.querySelector("#btnCercaLibriAnnoPagine");
            btnCercaLibriAnnoPagine.addEventListener('click', cercaLibriAnnoPagine);
        </script>

        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
    </body>
</html>
